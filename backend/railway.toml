# Railway: defina o "Root Directory" do serviço da API como `backend`.
# O Dockerfile já roda `prisma migrate deploy` antes de iniciar o servidor.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
