services:
  # Redis (filas BullMQ). noeviction: o BullMQ não pode perder chaves.
  - type: keyvalue
    name: financecontrol-redis
    ipAllowList: [] # só a rede privada da Render
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: financecontrol-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter # o plano free hiberna após 15 min e derrubaria webhooks e a Alexa
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: financecontrol-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: financecontrol-redis
          type: keyvalue
          property: connectionString
      # Segredos: defina no painel do Render → Environment (veja docs/DEPLOY.md)
      - key: JWT_SECRET
        sync: false
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: PLUGGY_WEBHOOK_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: ALEXA_OAUTH_CLIENT_ID
        sync: false
      - key: ALEXA_OAUTH_CLIENT_SECRET
        sync: false
      - key: ALEXA_REDIRECT_URIS
        sync: false
      - key: ALEXA_SKILL_STAGE
        value: development
      - key: ALEXA_CLIENT_ID
        sync: false
      - key: ALEXA_CLIENT_SECRET
        sync: false

databases:
  - name: financecontrol-db
    databaseName: assistente
    user: finuser
    plan: free # o plano free do PostgreSQL expira; use um plano pago em produção
